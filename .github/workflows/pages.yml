name: App demo (GitHub Pages)

# Publica a demonstração instalável (web/dist-demo) no GitHub Pages.
# Antes da primeira vez: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main, claude/peaceful-pasteur-oi8dm4]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
